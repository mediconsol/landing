services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landing
    ports:
      - "5520:80"
    restart: unless-stopped
    volumes:
      - ./status.json:/usr/share/nginx/html/status.json:ro
    depends_on:
      - landing-api

  landing-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: landing-api
    restart: unless-stopped
    volumes:
      - landing-data:/data

volumes:
  landing-data:
