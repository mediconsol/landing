server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://landing-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /status.json {
        auth_basic off;
        try_files $uri =404;
    }

    # 우분투 서버(ubuntu-aatto-kr, 타일넷 100.118.11.54) 상태.
    # 2026-10-03 aatto.kr 주소가 비아토로 넘어가며 그 서버의 모니터링 페이지가
    # 공개 주소를 잃었다 → 수집(cron)은 계속 도니 여기서 함께 본다.
    # 그쪽 nginx-proxy-manager 는 호스트명으로 라우팅하므로 Host: aatto.kr 로 보낸다.
    # 우분투가 꺼져 있어도 페이지가 멈추지 않게 타임아웃을 짧게 끊는다.
    location = /ubuntu/status.json {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://100.118.11.54/status.json;
        proxy_set_header Host aatto.kr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
